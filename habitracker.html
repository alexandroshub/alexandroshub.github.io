<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker | Alexandroshub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --surface-hover: #1f242c;
      --header-bg: #010409;
      --border-color: #30363d;
      --accent-primary: #58a6ff;
      --accent-success: #2ea043;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --danger-color: #f85149;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --today-highlight: rgba(88, 166, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .dashboard {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 0.7fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(1, 4, 9, 0.4);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background: var(--header-bg);
      color: var(--text-bright);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .daily-chart-container {
      padding: 18px 12px 8px 12px;
      height: 185px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .bar-fill {
      width: 100%;
      background: linear-gradient(180deg, var(--accent-primary) 0%, #1f6feb 100%);
      border-radius: 3px 3px 0 0;
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 2px;
    }

    .bar-col.is-today .bar-fill {
      background: linear-gradient(180deg, #3fb950 0%, var(--accent-success) 100%);
      box-shadow: 0 0 10px rgba(46, 160, 67, 0.4);
    }

    .bar-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .bar-col.is-today .bar-label {
      color: var(--text-bright);
      font-weight: 700;
    }

    .weekly-chart-container {
      padding: 18px 20px 8px 20px;
      height: 185px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 14px;
    }

    .week-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .week-bar-fill {
      width: 65%;
      background: linear-gradient(180deg, #3fb950 0%, var(--accent-success) 100%);
      border-radius: 4px 4px 0 0;
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 2px;
    }

    .week-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .kpi-stack {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .kpi-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .kpi-value {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
      padding: 8px;
    }

    .donut-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .donut {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: conic-gradient(var(--accent-primary) 0%, #21262d 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease;
    }

    .donut-inner {
      width: 92px;
      height: 92px;
      background: var(--card-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
    }

    .main-card {
      overflow-x: auto;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 12px;
    }

    .date-controls, .action-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, input[type="text"] {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      background: var(--card-bg);
      color: var(--text-bright);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-primary);
    }

    button {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(240, 246, 252, 0.1);
      background: #21262d;
      color: var(--text-bright);
      transition: all 0.2s ease;
    }

    button:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    button.primary {
      background: var(--accent-success);
      color: #ffffff;
      border-color: rgba(240, 246, 252, 0.1);
    }

    button.primary:hover {
      background: #3fb950;
    }

    button.danger {
      background: transparent;
      color: var(--danger-color);
      border-color: rgba(248, 81, 73, 0.4);
    }

    button.danger:hover {
      background: rgba(248, 81, 73, 0.15);
      border-color: var(--danger-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      border: 1px solid var(--border-color);
      text-align: center;
      padding: 6px 4px;
    }

    tbody tr:hover td {
      background-color: var(--surface-hover);
    }

    .habit-col {
      min-width: 220px;
      text-align: left;
      padding-left: 14px;
      font-weight: 500;
      background: var(--card-bg);
      color: var(--text-bright);
      position: sticky;
      left: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-right: 2px solid var(--border-color);
    }

    .delete-habit {
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0 8px;
      transition: color 0.2s;
    }

    .delete-habit:hover {
      color: var(--danger-color);
    }

    .week-header {
      background: var(--header-bg);
      color: var(--accent-primary);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .day-name {
      background: #161b22;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
    }

    .day-num {
      background: #1c2128;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .today-col {
      background-color: var(--today-highlight) !important;
      color: var(--accent-primary) !important;
      font-weight: 700;
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid #484f58;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      vertical-align: middle;
      transition: all 0.15s ease;
    }

    input[type="checkbox"]:hover {
      border-color: var(--accent-primary);
    }

    input[type="checkbox"]:checked {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    input[type="checkbox"]:checked::after {
      content: '✓';
      color: #0d1117;
      font-size: 12px;
      font-weight: 800;
    }

    .analysis-header {
      background: var(--header-bg);
      color: var(--text-bright);
    }

    .sub-analysis {
      background: #161b22;
      color: var(--text-muted);
      font-size: 11px;
    }

    .stat-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .progress-bar-bg {
      width: 68px;
      height: 8px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-success);
      transition: width 0.25s ease;
    }

    .wellness-header {
      background: var(--header-bg);
      color: var(--text-muted);
      font-weight: 600;
      text-align: left;
      padding-left: 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .wellness-input {
      width: 26px;
      border: none;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: transparent;
      color: var(--text-bright);
    }

    .wellness-input:focus {
      outline: 1px solid var(--accent-primary);
      background: #0d1117;
      border-radius: 3px;
    }

    @media (max-width: 1024px) {
      .top-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .top-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="top-grid">
    <div class="card">
      <div class="card-header">
        <span>Daily Progress</span>
        <span id="currentDateBadge" style="color: var(--accent-primary); font-family: 'JetBrains Mono', monospace;"></span>
      </div>
      <div class="daily-chart-container" id="dailyChart"></div>
    </div>

    <div class="card">
      <div class="card-header">Weekly Progress</div>
      <div class="weekly-chart-container" id="weeklyChart"></div>
    </div>

    <div class="kpi-stack">
      <div class="kpi-box">
        <div class="card-header" style="justify-content: center;">Goal</div>
        <div class="kpi-value" id="totalGoal">0</div>
      </div>
      <div class="kpi-box">
        <div class="card-header" style="justify-content: center;">Completed</div>
        <div class="kpi-value" id="totalCompleted" style="color: #3fb950;">0</div>
      </div>
      <div class="kpi-box">
        <div class="card-header" style="justify-content: center;">Left</div>
        <div class="kpi-value" id="totalLeft" style="color: var(--text-muted);">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="justify-content: center;">Monthly Completion</div>
      <div class="donut-wrapper">
        <div class="donut" id="overallDonut">
          <div class="donut-inner" id="overallPercent">0%</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card main-card">
    <div class="controls-bar">
      <div class="date-controls">
        <select id="yearSelect" onchange="changeDate()"></select>
        <select id="monthSelect" onchange="changeDate()"></select>
        <button onclick="goToToday()">Σήμερα</button>
      </div>

      <div class="action-controls">
        <input type="text" id="newHabitInput" placeholder="Νέα συνήθεια..." onkeypress="handleEnter(event)">
        <button class="primary" onclick="addHabit()">+ Προσθήκη</button>
        <button onclick="exportData()" title="Λήψη αντιγράφου ασφαλείας">Backup</button>
        <button class="danger" onclick="resetCurrentMonth()">Καθαρισμός Μήνα</button>
      </div>
    </div>
    <table id="habitTable"></table>
  </div>
</div>

<script>
  const monthNames = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];
  const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

  const defaultHabits = [
    { id: 'h1', name: 'Wake up at 05:00' },
    { id: 'h2', name: 'Gym & Mobility' },
    { id: 'h3', name: 'Deep Work / IoT Study' },
    { id: 'h4', name: 'Day Planning' },
    { id: 'h5', name: 'Clean Nutrition' },
    { id: 'h6', name: 'No Alcohol' },
    { id: 'h7', name: 'Social Media Detox' },
    { id: 'h8', name: 'Reading / Philosophy' },
    { id: 'h9', name: 'Meditate' }
  ];

  const now = new Date();
  let selectedYear = now.getFullYear();
  let selectedMonth = now.getMonth();

  let state = JSON.parse(localStorage.getItem('alexandrosHabitState_v2')) || {
    habits: defaultHabits,
    checks: {},
    mood: {},
    sleep: {}
  };

  function getDaysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function initSelectors() {
    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');

    yearSelect.innerHTML = '';
    for (let y = selectedYear - 2; y <= selectedYear + 3; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === selectedYear) opt.selected = true;
      yearSelect.appendChild(opt);
    }

    monthSelect.innerHTML = '';
    monthNames.forEach((name, idx) => {
      const days = getDaysInMonth(selectedYear, idx);
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${name} (${days})`;
      if (idx === selectedMonth) opt.selected = true;
      monthSelect.appendChild(opt);
    });

    document.getElementById('currentDateBadge').textContent =
      `${now.getDate()} ${monthNames[now.getMonth()].slice(0, 3)} ${now.getFullYear()}`;
  }

  function saveState() {
    localStorage.setItem('alexandrosHabitState_v2', JSON.stringify(state));
  }

  function changeDate() {
    selectedYear = parseInt(document.getElementById('yearSelect').value);
    selectedMonth = parseInt(document.getElementById('monthSelect').value);
    initSelectors();
    renderAll();
  }

  function goToToday() {
    const current = new Date();
    selectedYear = current.getFullYear();
    selectedMonth = current.getMonth();
    initSelectors();
    renderAll();
  }

  function handleEnter(e) {
    if (e.key === 'Enter') addHabit();
  }

  function addHabit() {
    const input = document.getElementById('newHabitInput');
    const val = input.value.trim();
    if (!val) return;

    const newHabit = {
      id: 'h_' + Date.now(),
      name: val
    };
    state.habits.push(newHabit);
    input.value = '';
    saveState();
    renderAll();
  }

  function removeHabit(habitId) {
    const habit = state.habits.find(h => h.id === habitId);
    if (!habit) return;
    if (!confirm(`Να διαγραφεί η συνήθεια "${habit.name}"; Το ιστορικό των υπολοίπων θα παραμείνει άθικτο.`)) return;

    state.habits = state.habits.filter(h => h.id !== habitId);
    saveState();
    renderAll();
  }

  function toggleCheck(habitId, day) {
    const key = `${selectedYear}_${selectedMonth}_${habitId}_${day}`;
    state.checks[key] = !state.checks[key];
    saveState();
    updateStats();
  }

  function updateWellness(type, day, val) {
    const num = parseFloat(val);
    const key = `${selectedYear}_${selectedMonth}_${day}`;
    if (val === '' || isNaN(num)) {
      delete state[type][key];
    } else {
      state[type][key] = Math.min(24, Math.max(0, num));
    }
    saveState();
  }

  function resetCurrentMonth() {
    if (!confirm(`Θέλεις σίγουρα να μηδενίσεις τα δεδομένα για ${monthNames[selectedMonth]} ${selectedYear};`)) return;
    const prefix = `${selectedYear}_${selectedMonth}_`;

    Object.keys(state.checks).forEach(k => { if (k.startsWith(prefix)) delete state.checks[k]; });
    Object.keys(state.mood).forEach(k => { if (k.startsWith(prefix)) delete state.mood[k]; });
    Object.keys(state.sleep).forEach(k => { if (k.startsWith(prefix)) delete state.sleep[k]; });

    saveState();
    renderAll();
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `habit-tracker-backup-${selectedYear}-${selectedMonth + 1}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function renderTable() {
    const days = getDaysInMonth(selectedYear, selectedMonth);
    const table = document.getElementById('habitTable');
    const isCurrentMonthYear = (selectedYear === now.getFullYear() && selectedMonth === now.getMonth());
    const todayDate = now.getDate();

    let html = `<thead><tr><th rowspan="3" style="background: var(--header-bg); color: var(--text-bright); font-size: 14px; text-align: left; padding-left: 14px; position: sticky; left: 0; z-index: 3;">Habits</th>`;

    let remainingDays = days;
    let weekNum = 1;
    while (remainingDays > 0) {
      const span = Math.min(7, remainingDays);
      html += `<th colspan="${span}" class="week-header">Week ${weekNum}</th>`;
      remainingDays -= span;
      weekNum++;
    }
    html += `<th colspan="5" class="analysis-header">Analysis</th></tr><tr>`;

    for (let d = 1; d <= days; d++) {
      const dateObj = new Date(selectedYear, selectedMonth, d);
      const dayName = dayNames[dateObj.getDay()];
      const todayClass = (isCurrentMonthYear && d === todayDate) ? 'today-col' : '';
      html += `<th class="day-name ${todayClass}">${dayName}</th>`;
    }

    html += `<th rowspan="2" class="sub-analysis">Goal</th>
             <th rowspan="2" class="sub-analysis">Actual</th>
             <th rowspan="2" class="sub-analysis">Left</th>
             <th rowspan="2" class="sub-analysis">Progress</th>
             <th rowspan="2" class="sub-analysis">%</th></tr><tr>`;

    for (let d = 1; d <= days; d++) {
      const todayClass = (isCurrentMonthYear && d === todayDate) ? 'today-col' : '';
      html += `<th class="day-num ${todayClass}">${d}</th>`;
    }
    html += `</tr></thead><tbody>`;

    state.habits.forEach((habit) => {
      html += `<tr>
        <td class="habit-col">
          <span>${habit.name}</span>
          <span class="delete-habit" title="Διαγραφή" onclick="removeHabit('${habit.id}')">×</span>
        </td>`;

      for (let d = 1; d <= days; d++) {
        const isChecked = state.checks[`${selectedYear}_${selectedMonth}_${habit.id}_${d}`] ? 'checked' : '';
        const todayClass = (isCurrentMonthYear && d === todayDate) ? 'today-col' : '';
        html += `<td class="${todayClass}"><input type="checkbox" ${isChecked} onchange="toggleCheck('${habit.id}', ${d})"></td>`;
      }

      html += `<td class="stat-cell" id="goal_${habit.id}">${days}</td>
               <td class="stat-cell" id="actual_${habit.id}">0</td>
               <td class="stat-cell" id="left_${habit.id}">${days}</td>
               <td><div class="progress-bar-bg"><div class="progress-bar-fill" id="pbar_${habit.id}" style="width:0%"></div></div></td>
               <td class="stat-cell" id="pct_${habit.id}">0%</td>
      </tr>`;
    });

    html += `<tr><td colspan="${days + 6}" class="wellness-header">Daily Metrics (1-10)</td></tr>`;

    html += `<tr><td class="habit-col" style="color: var(--accent-primary);">Mood Score</td>`;
    for (let d = 1; d <= days; d++) {
      const val = state.mood[`${selectedYear}_${selectedMonth}_${d}`] ?? '';
      const todayClass = (isCurrentMonthYear && d === todayDate) ? 'today-col' : '';
      html += `<td class="${todayClass}"><input type="number" min="1" max="10" class="wellness-input" value="${val}" onchange="updateWellness('mood', ${d}, this.value)"></td>`;
    }
    html += `<td colspan="5" style="background: var(--header-bg);"></td></tr>`;

    html += `<tr><td class="habit-col" style="color: #3fb950;">Sleep (Hours)</td>`;
    for (let d = 1; d <= days; d++) {
      const val = state.sleep[`${selectedYear}_${selectedMonth}_${d}`] ?? '';
      const todayClass = (isCurrentMonthYear && d === todayDate) ? 'today-col' : '';
      html += `<td class="${todayClass}"><input type="number" min="0" max="24" step="0.5" class="wellness-input" value="${val}" onchange="updateWellness('sleep', ${d}, this.value)"></td>`;
    }
    html += `<td colspan="5" style="background: var(--header-bg);"></td></tr></tbody>`;

    table.innerHTML = html;
  }

  function updateStats() {
    const days = getDaysInMonth(selectedYear, selectedMonth);
    const numHabits = state.habits.length;
    const totalGoal = days * numHabits;
    const isCurrentMonthYear = (selectedYear === now.getFullYear() && selectedMonth === now.getMonth());
    const todayDate = now.getDate();

    let totalCompleted = 0;
    const dailyCounts = new Array(days).fill(0);
    const weeklyCounts = [0, 0, 0, 0, 0];
    const weeklyGoals = [0, 0, 0, 0, 0];

    state.habits.forEach((habit) => {
      let habitActual = 0;
      for (let d = 1; d <= days; d++) {
        const weekIdx = Math.floor((d - 1) / 7);
        weeklyGoals[weekIdx]++;
        if (state.checks[`${selectedYear}_${selectedMonth}_${habit.id}_${d}`]) {
          habitActual++;
          totalCompleted++;
          dailyCounts[d - 1]++;
          weeklyCounts[weekIdx]++;
        }
      }

      const left = days - habitActual;
      const pct = days > 0 ? Math.round((habitActual / days) * 100) : 0;

      document.getElementById(`actual_${habit.id}`).innerText = habitActual;
      document.getElementById(`left_${habit.id}`).innerText = left;
      document.getElementById(`pbar_${habit.id}`).style.width = `${pct}%`;
      document.getElementById(`pct_${habit.id}`).innerText = `${pct}%`;
    });

    document.getElementById('totalGoal').innerText = totalGoal;
    document.getElementById('totalCompleted').innerText = totalCompleted;
    document.getElementById('totalLeft').innerText = totalGoal - totalCompleted;

    const overallPct = totalGoal > 0 ? Math.round((totalCompleted / totalGoal) * 100) : 0;
    document.getElementById('overallPercent').innerText = `${overallPct}%`;
    document.getElementById('overallDonut').style.background =
      `conic-gradient(var(--accent-primary) ${overallPct}%, #21262d ${overallPct}%)`;

    const dailyChart = document.getElementById('dailyChart');
    dailyChart.innerHTML = '';
    for (let d = 0; d < days; d++) {
      const pct = numHabits > 0 ? Math.round((dailyCounts[d] / numHabits) * 100) : 0;
      const isToday = (isCurrentMonthYear && (d + 1) === todayDate) ? 'is-today' : '';
      dailyChart.innerHTML += `
        <div class="bar-col ${isToday}" title="Day ${d + 1}: ${pct}% (${dailyCounts[d]}/${numHabits})">
          <div class="bar-fill" style="height: ${pct}%"></div>
          <div class="bar-label">${d + 1}</div>
        </div>`;
    }

    const weeklyChart = document.getElementById('weeklyChart');
    weeklyChart.innerHTML = '';
    for (let w = 0; w < 5; w++) {
      if (weeklyGoals[w] === 0) continue;
      const pct = Math.round((weeklyCounts[w] / weeklyGoals[w]) * 100);
      weeklyChart.innerHTML += `
        <div class="week-bar-col" title="Week ${w + 1}: ${pct}%">
          <div class="week-bar-fill" style="height: ${pct}%"></div>
          <div class="week-label">W${w + 1}</div>
        </div>`;
    }
  }

  function renderAll() {
    renderTable();
    updateStats();
  }

  initSelectors();
  renderAll();
</script>
</body>
</html>
